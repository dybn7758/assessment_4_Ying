name: Deploy Forecasting Service

on:
  push:
    branches:
      - main
    paths:
      - "services/forecasting/**"
      - "k8s/forecasting-*.yaml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: assessment-4-ying-forecasting
  EKS_CLUSTER: assessment4-ying-eks

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            services/forecasting

      - name: Tag and push image
        run: |
          ECR_REGISTRY=388691194728.dkr.ecr.us-east-1.amazonaws.com

          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/forecasting-service \
            forecasting-service=388691194728.dkr.ecr.us-east-1.amazonaws.com/assessment-4-ying-forecasting:${{ github.sha }} \
            -n forecasting

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/forecasting-service \
            -n forecasting \
            --timeout=180s

          kubectl get pods -n forecasting