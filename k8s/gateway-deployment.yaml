apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: 388691194728.dkr.ecr.us-east-1.amazonaws.com/assessment-4-ying-gateway:latest
          
          envFrom:
            - configMapRef:
                name: gateway-config

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: gateway
spec:
  selector:
    app: gateway-service
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP