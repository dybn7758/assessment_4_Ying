apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: fraud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-service
  template:
    metadata:
      labels:
        app: fraud-service
    spec:
      serviceAccountName: fraud-service-account

      containers:
        - name: fraud-service
          image: 388691194728.dkr.ecr.us-east-1.amazonaws.com/assessment-4-ying-fraud:latest
          envFrom:
            - configMapRef:
                name: fraud-config
            - secretRef:
                name: fraud-secret
          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2

          

---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service
  namespace: fraud
spec:
  selector:
    app: fraud-service
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP